[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osintx-ai"
version = "1.1.0"
description = "OSINT-X AI — AI-Powered Linux OSINT Investigation Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OSINT-X AI Contributors" }]

dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-mock>=3.14"]
reports = ["python-docx>=1.1.2", "reportlab>=4.2"]
qr = ["pyzbar>=0.1.9"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
config = ["config.yaml"]
plugins = ["installed/*.py"]

[project.scripts]
osintx = "cli:app"

[tool.setuptools]
include-package-data = false
py-modules = ["cli", "osintx"]

[tool.setuptools.packages.find]
exclude = ["*.__pycache__", "*.__pycache__.*"]
include = ["config*", "core*", "engines*", "ai*", "modules*", "integrations*", "plugins*", "reports*", "database*", "utils*"]

[tool.pytest.ini_options]
pythonpath = ["."]
